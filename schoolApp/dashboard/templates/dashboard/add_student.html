{% extends 'dashboard/base.html' %}
{% block content %}
<h2>Add Student</h2>
<form method="POST">
    {% csrf_token %}
    <label>Name:</label><br>
    <input type="text" name="name"><br><br>
    <label>Age:</label><br>
    <input type="number" name="age"><br><br>
    <label>Grade:</label><br>
    <input type="text" name="grade"><br><br>
    <button type="submit">Save</button>
</form>
{% endblock %}
