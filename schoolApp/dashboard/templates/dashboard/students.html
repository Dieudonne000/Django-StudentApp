{% extends 'dashboard/base.html' %}
{% block content %}
<h2>Students</h2>

{% if students %}
<table border="1" cellpadding="6">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Grade</th>
        <th>Actions</th>
    </tr>
    {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.grade }}</td>
            <td>
                <a href="{% url 'edit_student' student.id %}">Edit</a> |
                <a href="{% url 'delete_student' student.id %}">Delete</a>
            </td>
        </tr>
    {% endfor %}
</table>
{% else %}
    <p>No students yet. <a href="/add/">Add one</a></p>
{% endif %}
{% endblock %}
